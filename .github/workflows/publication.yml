name: Catalog-pack publication

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Canonical annotated source tag (v1.0.1, not refs/tags/v1.0.1)
        required: true
        type: string
      source_ref:
        description: Full peeled commit targeted by the annotated source tag
        required: true
        type: string

concurrency:
  group: catalog-pack-publication-${{ inputs.source_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    environment: catalog-pack-publication-rehearsal
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_ENVIRONMENT: catalog-pack-publication-rehearsal
    outputs:
      manifest_digest: ${{ steps.publish.outputs.manifest_digest }}
      support_commit: ${{ steps.publish.outputs.support_commit }}
      support_blob: ${{ steps.publish.outputs.support_blob }}
    steps:
      - name: Check out the catalog-pack source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out current Effigy support authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: inflatable-cookie/effigy
          ref: main
          path: .authority/effigy
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned ORAS
        env:
          ORAS_VERSION: "1.3.3"
          ORAS_SHA256: "9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59"
        run: |
          curl -fsSL -o oras.tgz "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "${ORAS_SHA256}  oras.tgz" | sha256sum -c -
          tar -xzf oras.tgz oras
          install -m 0755 oras /usr/local/bin/oras
          rm -f oras.tgz oras
          oras version

      - name: Validate the independent pack source
        run: python3 scripts/catalog_pack.py validate

      - name: Verify current Effigy support policy
        run: python3 scripts/catalog_pack.py validate --effigy-root .authority/effigy --require-authority

      - name: Verify Effigy release freshness
        run: python3 scripts/catalog_pack.py support-releases --effigy-root .authority/effigy

      - name: Build and verify the deterministic OCI candidate
        run: python3 scripts/catalog_pack.py oci-layout

      - name: Publish the version pointer
        id: publish
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
          CATALOG_PACK_PUBLICATION_MUTATE: "1"
        run: >-
          python3 scripts/catalog_pack.py publish
          --phase version
          --effigy-root .authority/effigy
          --source-tag "$SOURCE_TAG"
          --source-ref "$SOURCE_REF"
          --mutate

  finalize:
    # Operator checkpoint: after publish succeeds, make the linked organization
    # package public through GitHub package settings, then approve this job.
    # Premature approval fails closed at finalize-preflight and is retryable.
    needs: publish
    environment: catalog-pack-publication-rehearsal
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_ENVIRONMENT: catalog-pack-publication-rehearsal
    steps:
      - name: Check out the catalog-pack source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out current Effigy support authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: inflatable-cookie/effigy
          ref: main
          path: .authority/effigy
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned ORAS
        env:
          ORAS_VERSION: "1.3.3"
          ORAS_SHA256: "9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59"
        run: |
          curl -fsSL -o oras.tgz "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "${ORAS_SHA256}  oras.tgz" | sha256sum -c -
          tar -xzf oras.tgz oras
          install -m 0755 oras /usr/local/bin/oras
          rm -f oras.tgz oras
          oras version

      - name: Validate the independent pack source
        run: python3 scripts/catalog_pack.py validate

      - name: Verify current Effigy support policy
        run: python3 scripts/catalog_pack.py validate --effigy-root .authority/effigy --require-authority

      - name: Verify Effigy release freshness
        run: python3 scripts/catalog_pack.py support-releases --effigy-root .authority/effigy

      - name: Recheck version pointer and public package linkage
        id: preflight
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
          CATALOG_PACK_PUBLICATION_MUTATE: "1"
          CATALOG_PACK_SUPPORT_COMMIT: ${{ needs.publish.outputs.support_commit }}
          CATALOG_PACK_SUPPORT_BLOB: ${{ needs.publish.outputs.support_blob }}
          CATALOG_PACK_VERSION_DIGEST: ${{ needs.publish.outputs.manifest_digest }}
        run: >-
          python3 scripts/catalog_pack.py publish
          --phase finalize-preflight
          --effigy-root .authority/effigy
          --source-tag "$SOURCE_TAG"
          --source-ref "$SOURCE_REF"
          --mutate

      - name: Attach digest-bound provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # pinned actions/attest
        with:
          subject-name: ghcr.io/inflatable-cookie/effigy-catalog-pack
          subject-digest: ${{ steps.preflight.outputs.manifest_digest }}
          push-to-registry: true

      - name: Prove anonymous bytes, refresh authority, and move stable once
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
          CATALOG_PACK_PUBLICATION_MUTATE: "1"
          CATALOG_PACK_SUPPORT_COMMIT: ${{ needs.publish.outputs.support_commit }}
          CATALOG_PACK_SUPPORT_BLOB: ${{ needs.publish.outputs.support_blob }}
          CATALOG_PACK_VERSION_DIGEST: ${{ needs.publish.outputs.manifest_digest }}
        run: >-
          python3 scripts/catalog_pack.py publish
          --phase finalize
          --effigy-root .authority/effigy
          --source-tag "$SOURCE_TAG"
          --source-ref "$SOURCE_REF"
          --mutate
