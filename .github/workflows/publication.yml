name: Catalog-pack publication

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing annotated source tag matching the pack version
        required: true
        type: string
      source_ref:
        description: Full peeled commit targeted by the annotated source tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    environment: catalog-pack-publication-rehearsal
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the catalog-pack source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out current Effigy support authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: inflatable-cookie/effigy
          ref: main
          path: .authority/effigy
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned ORAS
        env:
          ORAS_VERSION: "1.3.3"
          ORAS_SHA256: "9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59"
        run: |
          curl -fsSL -o oras.tgz "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "${ORAS_SHA256}  oras.tgz" | sha256sum -c -
          tar -xzf oras.tgz oras
          install -m 0755 oras /usr/local/bin/oras
          rm -f oras.tgz oras
          oras version

      - name: Validate the independent pack source
        run: python3 scripts/catalog_pack.py validate

      - name: Verify current Effigy support policy
        run: python3 scripts/catalog_pack.py validate --effigy-root .authority/effigy --require-authority

      - name: Verify Effigy release freshness
        run: python3 scripts/catalog_pack.py support-releases --effigy-root .authority/effigy

      - name: Build and verify the deterministic OCI candidate
        run: python3 scripts/catalog_pack.py oci-layout

      - name: Publish only after every card gate
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
          CATALOG_PACK_PUBLICATION_MUTATE: "1"
        run: >-
          python3 scripts/catalog_pack.py publish
          --effigy-root .authority/effigy
          --source-tag "$SOURCE_TAG"
          --source-ref "$SOURCE_REF"
          --mutate
