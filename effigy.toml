[manifest]
minimum_effigy_version = "0.12.1"

[tasks]
"pack:inventory" = "python3 scripts/catalog_pack.py inventory"
"pack:validate" = "python3 scripts/catalog_pack.py validate"
"pack:entrypoint-check" = "python3 scripts/catalog_pack_entrypoint_check.py"
"pack:smoke-identity-check" = "python3 scripts/catalog_pack_effigy_tests.py"
"pack:support" = "python3 scripts/catalog_pack.py validate --require-authority"
"pack:import-proof" = "python3 scripts/catalog_pack.py import-proof"
"pack:oci" = "python3 scripts/catalog_pack.py oci-layout"
"pack:rehearse" = "python3 scripts/catalog_pack.py rehearse --require-authority"
"pack:publication-check" = "python3 scripts/catalog_pack.py publication-check --require-authority"
"pack:proposal-check" = "python3 scripts/catalog_pack.py proposal-check"
"pack:support-releases" = "python3 scripts/catalog_pack.py support-releases"
"pack:effigy" = [
  { run = "python3 scripts/catalog_pack.py effigy-smoke --require-authority", timeout_ms = 120000 },
]
"pack:workflow-check" = "python3 scripts/catalog_pack.py workflow-check"
"pack:provider-controls" = "python3 scripts/catalog_pack.py provider-controls"
"pack:compatibility-check" = [
  { run = "python3 scripts/catalog_pack_compatibility.py", timeout_ms = 60000 },
]

health = [
  { task = "pack:validate" },
  { task = "pack:oci" },
]

validate = [
  { task = "pack:validate" },
  { task = "pack:entrypoint-check" },
  { task = "pack:support" },
  { task = "pack:oci" },
  { task = "pack:rehearse" },
  { task = "pack:publication-check" },
  { task = "pack:proposal-check" },
]

qa = [
  { task = "validate" },
  { task = "pack:effigy" },
  { task = "pack:workflow-check" },
]

[test.suites]
foundation = "python3 scripts/catalog_pack.py test"
