# Concepts that no longer exist. Run the check with
# `effigy skill run northstar-lean/retired-concepts`.

# Immutable artefacts: never rewritten, exempt from every retirement, and
# skipped by check-links. pack/ is the published release content.
frozen = ["pack/"]

